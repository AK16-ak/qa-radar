# QA Radar — SDET / Automation Testing jobs in India + Remote.
# Edit freely — no code changes needed.

# ----------------------------------------------------------------------------
# WATCHLIST: companies whose careers pages (via their ATS) you want to monitor.
# ----------------------------------------------------------------------------
watchlist:
  greenhouse:
    - postman           # API testing leader, India/global
    - phonepe           # India fintech
    - groww             # India fintech
    - druva             # India/global
    - netskope          # India/global
    - rubrik
    - atlassian         # Strong QA culture
    - stripe
    - databricks
    - coinbase
    - pinterest
    - gitlab
    - elastic
    - mongodb
    - cloudflare
    - twilio
    - datadog
    - samsara
    - discord
    - airtable
    - figma
    - reddit
    - instacart
    - roblox
    - gusto
  lever:
    - cred              # India fintech
    - meesho            # India e-commerce
    - epifi             # India (Fi Money)
    - zeta              # India fintech
    - browserstack      # Testing platform, India
    - paytm             # India fintech
  ashby:
    - sarvam            # India (Sarvam AI)
    - perplexity
    - linear
    - vercel
    - openai
    - notion
    - cursor            # Anysphere
    - ramp
    - cohere
    - watershed
    - sierra
  smartrecruiters:
    - Wise
    - Visa
    - SAP
    - Freshworks        # India SaaS — 157 live jobs
    - SWIGGY            # India food delivery

# ----------------------------------------------------------------------------
# DISCOVERY: broad search across free job APIs (beyond your watchlist).
# Adzuna needs free keys (ADZUNA_APP_ID / ADZUNA_APP_KEY as GitHub Secrets);
# if not set, Adzuna is skipped automatically.
# ----------------------------------------------------------------------------
discovery:
  enabled: true
  queries:
    - "sdet india"
    - "test automation engineer india"
    - "automation tester india"
    - "sdet"
    - "test automation engineer"
  remotive_search: "sdet"
  remoteok: true
  arbeitnow: true
  jobicy_tags:
    - automation
    - testing
  himalayas: true
  himalayas_limit: 50
  themuse:
    enabled: true
    pages: 3
    categories:
      - "Software Engineering"
    locations:
      - "Bengaluru, India"

  # --- New India-focused sources (all free, no API keys) ---

  ycombinator:
    enabled: true
    queries:
      - "sdet"
      - "test automation"
      - "quality engineer"
      - "automation engineer"

  wellfound:
    enabled: true
    queries:
      - "sdet"
      - "test automation"
      - "quality engineer"

  google_careers:
    enabled: true
    location: "India"
    queries:
      - "sdet"
      - "test automation"
      - "software engineer in test"

  workday:
    companies:
      - name: Amazon
        tenant: amazon
        site: AmazonJobs
        wd_version: 5
        queries: ["sdet", "test automation", "quality engineer"]
      - name: Microsoft
        tenant: microsoft
        site: microsoft
        wd_version: 5
        queries: ["sdet", "test automation", "quality engineer"]
      - name: Salesforce
        tenant: salesforce
        site: External
        wd_version: 5
        queries: ["sdet", "test automation"]
      - name: Netflix
        tenant: netflix
        site: External
        wd_version: 5
        queries: ["sdet", "test automation"]
      - name: Uber
        tenant: uber
        site: universalSearch
        wd_version: 5
        queries: ["sdet", "test automation", "quality engineer"]
      - name: Adobe
        tenant: adobeinternals
        site: External
        wd_version: 5
        queries: ["sdet", "test automation"]

  # LinkedIn via RapidAPI (free tier: ~5-10 req/month, $0 charges)
  # Add RAPIDAPI_KEY to GitHub Secrets if you want LinkedIn results.
  # If limit exceeded, gracefully skips — no charges on free plan.
  linkedin:
    enabled: true
    queries:
      - "sdet india"
      - "test automation engineer india"

  # Bright Data SERP API — Google Jobs (free tier: 5,000 req/month)
  # Aggregates LinkedIn, Naukri, Indeed, Glassdoor & Indian job boards.
  # Sign up: https://brightdata.com/cp/start (no credit card needed)
  # Create SERP API zone → get API key and zone name.
  # Add BRIGHTDATA_API_KEY and BRIGHTDATA_ZONE to GitHub Secrets.
  brightdata:
    enabled: true
    queries:
      - "sdet india"
      - "test automation engineer india"
      - "automation tester bengaluru"
      - "sdet pune"
      - "qa automation engineer hyderabad"

# ----------------------------------------------------------------------------
# FILTERS — title must match an include keyword AND location must be in
# allowed Indian cities or Remote. Word-boundary aware ("sdet" != "sdetail").
# ----------------------------------------------------------------------------
include_keywords:
  - sdet
  - test automation
  - test automation engineer
  - automation engineer
  - automation tester
  - automation testing
  - selenium
  - cypress
  - playwright
  - appium
  - software development engineer in test

exclude_keywords:
  - senior staff
  - staff
  - principal
  - architect
  - lead
  - manager
  - director
  - head of
  - vp
  - vice president
  - founding
  - intern
  - internship
  - trainee
  - apprentice
  - frontend developer
  - backend developer
  - fullstack developer
  - data scientist
  - data analyst
  - machine learning
  - ml engineer
  - support engineer
  - sales
  - recruiter
  - designer
  - product manager
  - devops engineer
  - sre
  - site reliability
  - network engineer
  - hardware

# Allowed locations — jobs MUST be in one of these cities or Remote.
# The filter also accepts any location containing "india".
allowed_locations:
  - gurugram
  - gurgaon
  - pune
  - hyderabad
  - bengaluru
  - bangalore
  - delhi
  - new delhi
  - noida
  - mumbai
  - remote

# Strict mode ON — only allowed locations pass. Jobs in other cities are dropped.
strict_location: true

# ----------------------------------------------------------------------------
# RESUME: Auto-tailored resume generation per job.
# Set enabled: true to generate ATS-optimized PDFs for matching jobs.
# ----------------------------------------------------------------------------
resume:
  enabled: true
  experience_years: 3         # Your total years of experience
  max_target_years: 6         # Max YOE you'll target (skip jobs asking more)
  max_resumes_per_run: 10     # Limit PDFs per run to avoid Actions timeout
